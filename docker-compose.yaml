# Hermes en modo servidor: docker compose up -d --build
#
# Antes del primer arranque, crea output/ y .garminconnect/ (con los tokens de Garmin): si no
# existen, Docker las crea como root y Hermes no podría escribir en ellas.
services:
  hermes:
    build: .
    image: hermes
    restart: unless-stopped
    # El mismo UID que el AIRFLOW_UID de Omnis, que es con el que omnis-storage crea los Excels
    # de temp/: si no, Hermes no podría moverlos a done/
    user: "${HERMES_UID:-1000}:0"
    env_file: .env
    environment:
      # La hora de los cron de los jobs que no dicen su timezone
      TZ: Europe/Madrid
      # El tokenstore por defecto de Garmin es ~/.garminconnect
      HOME: /home/hermes
      OMNIS_STORAGE_TEMP_DIR: /data/temp
    extra_hosts:
      # Para llegar al storage de Omnis por su puerto publicado en esta máquina: en el .env,
      # OMNIS_STORAGE_DATA_DIR=http://host.docker.internal:9000
      - "host.docker.internal:host-gateway"
    volumes:
      - ./jobs:/app/jobs:ro
      - ./transforms:/app/transforms:ro
      - ./output:/app/output
      - ./.garminconnect:/home/hermes/.garminconnect
      # La carpeta temp/ del storage de Omnis en esta máquina, la del OMNIS_STORAGE_TEMP_DIR del .env
      - ${OMNIS_STORAGE_TEMP_DIR:?falta OMNIS_STORAGE_TEMP_DIR en el .env}:/data/temp
