origin:
  location:
    system: garmin
    dataset: daily_summary
    date: yesterday
    days: 1
  format: json
transforms:
  after:
    - name: garmin.daily_summary
destination:
  location:
    system: http
    url: ${OMNIS_STORAGE_DATA_DIR}/raw/daily_summary
    headers:
      Authorization: Basic ${OMNIS_STORAGE_AUTH}
  format: csv
schedule:
  cron: "0 6 * * *"
