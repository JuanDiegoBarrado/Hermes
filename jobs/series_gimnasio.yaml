origin:
  location:
    system: filesystem
    pattern: ${OMNIS_STORAGE_TEMP_DIR}/series_gimnasio/*.xlsx
  format: xlsx
transforms:
  after:
    - name: gimnasio.series
destination:
  location:
    system: http
    url: ${OMNIS_STORAGE_DATA_DIR}/raw/series_gimnasio
    basic_auth: ${OMNIS_STORAGE_AUTH}
  format: csv
schedule:
  cron: "0 6 * * *"
