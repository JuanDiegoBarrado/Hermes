origin:
  location:
    system: filesystem
    path: input/gimnasio/gimnasio.xlsx
  format: xlsx
transforms:
  after:
    - name: gimnasio.series
destination:
  location:
    system: http
    url: ${OMNIS_STORAGE_URL}/raw/series_gimnasio
    headers:
      Authorization: Basic ${OMNIS_STORAGE_AUTH}
  format: csv
schedule:
  cron: "0 6 * * *"
