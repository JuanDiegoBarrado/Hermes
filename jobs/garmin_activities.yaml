origin:
    location:
        system: garmin
        dataset: activities
        date: yesterday
        days: 1
    format: json
transforms:
    after:
        - name: garmin.activities
      # options:
      #   activity_types: [running, trail_running, treadmill_running]
destination:
    location:
        system: http
        url: ${OMNIS_STORAGE_DATA_DIR}/raw/activities
        basic_auth: ${OMNIS_STORAGE_AUTH}
    format: csv
schedule:
    cron: "0 6 * * *"
